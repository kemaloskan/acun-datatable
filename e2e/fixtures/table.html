<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E · table</title>
<link rel="stylesheet" href="/packages/renderer-dom/dist/styles.css">
<!-- Loads the real build output (run `npm run build` first). -->
<script type="importmap">
{ "imports": {
  "@acunsoft/datatable-core": "/packages/core/dist/index.js",
  "@acunsoft/datatable-dom": "/packages/renderer-dom/dist/index.js"
} }
</script>
</head>
<body>
<div id="orders"></div>
<script type="module">
import { createDataTable } from '@acunsoft/datatable-core';
import { labelsEn, renderDataTable } from '@acunsoft/datatable-dom';

const virtualRows = new URLSearchParams(location.search).has('virtual');
const base = ['Ayşe', 'Ali', 'Can', 'Deniz', 'Ece', 'Fatma', 'Gül', 'Hakan', 'İrem', 'Kaan', 'Lale', 'Mert'];
// ?virtual: 50,000 rows, scrolled instead of paged.
const names = virtualRows ? Array.from({ length: 50_000 }, (_, i) => `${base[i % base.length]} ${i + 1}`) : base;
const table = createDataTable({
  data: names.map((customer, index) => ({ id: index + 1, customer, total: ((index * 37) % 100) + 10, city: ['İstanbul', 'Ankara', 'İzmir'][index % 3] })),
  columns: [
    { id: 'customer', header: 'Customer', accessorKey: 'customer', enableSorting: true, enableFiltering: true, ...(new URLSearchParams(location.search).has('edit') ? { editable: true } : {}) },
    { id: 'total', header: 'Total', accessorKey: 'total', type: 'number', enableSorting: true, enableFiltering: true, filter: true },
    { id: 'city', header: 'City', accessorKey: 'city', priority: 3, enableFiltering: true,
      filter: { options: [{ value: 'İstanbul', label: 'İstanbul' }, { value: 'Ankara', label: 'Ankara' }, { value: 'İzmir', label: 'İzmir' }] } },
  ],
  locale: 'tr',
  initialState: { pageSize: 5 },
});
// Turkish number and date formats with the English texts.
// ?responsive=collapse|modal|scroll and ?size=sm|lg try the other modes; ?detail adds child rows, ?fixed pins columns, ?columns resizes and moves them, ?edit edits customers in place.
const params = new URLSearchParams(location.search);
const detail = params.has('detail')
  ? row => new Promise(resolve => setTimeout(() => resolve(`Order lines of ${row.original.customer}`), 50))
  : undefined;
renderDataTable(document.getElementById('orders'), table, {
  caption: 'Orders', selectable: true, locale: 'tr', labels: labelsEn, pageSizes: [5, 10], search: { debounceMs: 0 },
  ...(params.has('responsive') ? { responsive: params.get('responsive') } : {}), size: params.get('size') ?? 'md',
  ...(params.has('filterPanel') ? { filterPanel: params.get('filterPanel') } : {}),
  rowActions: [{ id: 'edit', label: 'Edit', onSelect: row => { window.__edited = row.id; } }],
  ...(detail ? { detail } : {}),
  ...(params.has('fixed') ? { fixedColumns: { start: 1, end: 1 } } : {}),
  ...(params.has('columns') ? { resizableColumns: true, reorderableColumns: true } : {}),
  ...(virtualRows ? { virtual: true, scrollY: '420px' } : {}),
  ...(params.has('edit') ? {
    onEdit: async ({ row, value }) => {
      await new Promise(resolve => setTimeout(resolve, 30));
      if (value === 'bad') throw new Error('Rejected by the server');
      table.setData(table.getCoreRows().map(item => (item.id === row.id ? { ...item.original, customer: value } : item.original)));
    },
  } : {}),
});
window.__table = table;
document.body.dataset.ready = 'true';
</script>
</body>
</html>
