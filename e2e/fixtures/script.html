<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="e2e-token">
<title>E2E · script tag</title>
<!-- The all-in-one <script> build of @acunsoft/datatable (run `npm run build` first). -->
<link rel="stylesheet" href="/packages/datatable/dist/styles.css">
<script src="/packages/datatable/dist/acun-datatable.min.js"></script>
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px 1200px; background: #f5f6f8; }</style>
</head>
<body>
<table id="myTable"></table>
<script>
window.dt = new AcunDataTable('#myTable', {
  fixedHeader: true,
  processing: true,
  serverSide: true,
  ajax: { url: '/e2e/api/products', method: 'POST' },
  pagination: { enabled: true, pageSize: 25, pageSizes: [10, 25, 50, 100] },
  sorting: { enabled: true, multiSort: true },
  searching: { enabled: true, debounce: 300 },
  language: 'tr',
});
dt.ready.then(() => { document.body.dataset.ready = 'true'; });
</script>
</body>
</html>
