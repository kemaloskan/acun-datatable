name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version: .nvmrc (Node.js 24 LTS).
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
