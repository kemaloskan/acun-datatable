name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify (Node ${{ matrix.node-version }})
    strategy:
      # Report every supported version; one failure must not hide the others.
      fail-fast: false
      matrix:
        # Node 24 is the development standard (see .nvmrc). Every supported LTS
        # line is tested for consumer compatibility; Node 20 reached end of
        # life in April 2026 and is no longer supported.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # npm ci keeps the committed lockfile authoritative and reproducible.
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # Each built file must stay within its gzip budget (size-budget.json).
      - run: npm run size

  browsers:
    # Real-browser tests of the DOM renderer (SPEC M3): keyboard-only use,
    # accessibility semantics and the XSS fixture. Browser behaviour does not
    # depend on the Node version, so this runs once, on the .nvmrc version.
    runs-on: ubuntu-latest
    name: browsers (Chromium, Firefox, WebKit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps installs the OS libraries the browsers need (cached browsers
      # still need them on a fresh runner).
      - run: npx playwright install --with-deps chromium firefox webkit
      # The Livewire browser tests run the Laravel package's workbench app (testbench serve).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
        working-directory: packages/adapter-laravel
      - run: npm run e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  php:
    # acunsoft/datatable-laravel: oldest and newest supported PHP.
    runs-on: ubuntu-latest
    name: php ${{ matrix.php }} (datatable-laravel)
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    defaults:
      run:
        working-directory: packages/adapter-laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none
      # A library: no committed lock file; resolve the newest versions allowed
      # by composer.json for this PHP version.
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test

  databases:
    # Exact counts with a time limit on real servers (statement_timeout,
    # max_execution_time, max_statement_time); SQLite cannot test them.
    runs-on: ubuntu-latest
    name: count time limit (PostgreSQL, MySQL, MariaDB)
    defaults:
      run:
        working-directory: packages/adapter-laravel
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: secret, POSTGRES_DB: adt_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: adt_test }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: secret, MARIADB_DATABASE: adt_test }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, zip
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: PostgreSQL
        run: vendor/bin/phpunit --filter PostgresCountTest
        env: { ADT_TEST_PGSQL: 'postgres://postgres:secret@127.0.0.1:5432/adt_test' }
      - name: MySQL
        run: vendor/bin/phpunit --filter MysqlCountTest
        env: { ADT_TEST_MYSQL: 'mysql://root:secret@127.0.0.1:3306/adt_test' }
      - name: MariaDB (through the mysql driver)
        run: vendor/bin/phpunit --filter MysqlCountTest
        env: { ADT_TEST_MYSQL: 'mysql://root:secret@127.0.0.1:3307/adt_test' }
