name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify (Node ${{ matrix.node-version }})
    strategy:
      # Report every supported version; one failure must not hide the others.
      fail-fast: false
      matrix:
        # Node 24 is the development standard (see .nvmrc). Every supported LTS
        # line is tested for consumer compatibility; Node 20 reached end of
        # life in April 2026 and is no longer supported.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # npm ci keeps the committed lockfile authoritative and reproducible.
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

  browsers:
    # Real-browser tests of the DOM renderer (SPEC M3): keyboard-only use,
    # accessibility semantics and the XSS fixture. Browser behaviour does not
    # depend on the Node version, so this runs once, on the .nvmrc version.
    runs-on: ubuntu-latest
    name: browsers (Chromium, Firefox, WebKit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps installs the OS libraries the browsers need (cached browsers
      # still need them on a fresh runner).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
