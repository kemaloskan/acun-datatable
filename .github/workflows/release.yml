name: Release
# Publishes the npm packages. Never runs on its own: start it by hand from the
# Actions tab, on main, after the version commit (`npm run version-packages`)
# has been reviewed and merged. See RELEASING.md.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# npm trusted publishing (OIDC): no npm token is stored anywhere. Each package
# trusts this repository and this workflow file on npmjs.com (see RELEASING.md);
# provenance is added automatically. Needs npm 11.5.1+ (Node 24 ships it).
permissions:
  contents: write # push the release tags
  id-token: write # npm trusted publishing

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      # Changesets creates annotated release tags, which need a committer
      # identity; without one the tags are silently skipped.
      - name: Git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Unversioned changesets mean the version commit is missing: stop
      # instead of publishing the old version numbers.
      - name: Require versioned changesets
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md')
          if [ -n "$pending" ]; then echo "Run 'npm run version-packages' first:"; echo "$pending"; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:chromium
      # check + test + build + changeset publish (only versions not yet on npm).
      - run: npm --version
      - run: npm run release
      - name: Push release tags
        run: |
          git push --tags
          # Fail loudly if this release's tags did not reach GitHub.
          for package in packages/core packages/datasource-http packages/renderer-dom packages/export packages/datatable packages/vue packages/react; do
            tag="$(node -p "const p=require('./$package/package.json'); p.name + '@' + p.version")"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || { echo "missing tag $tag"; exit 1; }
          done
