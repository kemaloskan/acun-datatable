<!-- The theme before the first paint (no light flash in dark mode); the toggle below keeps it. -->
<script>
  (() => {
    let stored = null;
    try { stored = localStorage.getItem('adt-demo-theme'); } catch { /* storage blocked */ }
    document.documentElement.setAttribute('data-theme', stored === 'dark' || stored === 'light' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>

<style>

  :root[data-theme="dark"] {
    --page-bg: #0b0d12; --page-fg: #e6e8ec; --page-muted: #a3aab8; --page-line: #262c38; --page-card: #12151c;

  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--page-fg); background: var(--page-bg); }
  a { color: var(--page-accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }

  header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--page-card); border-bottom: 1px solid var(--page-line); }

  @media (max-width: 640px) { header nav { display: none; } header { padding: 10px 16px; gap: 10px; } header .brand { white-space: nowrap; } header .tools { margin-left: auto; padding-left: 0; border-left: 0; } header nav { gap: 10px; } main { padding-top: 16px; } h1 { font-size: 23px; } }

<script>
(() => {
  // ---------- Sample data (deterministic) ----------
  const FIRST = ['Ayşe', 'Ali', 'Can', 'Deniz', 'Ece', 'Fatma', 'Gül', 'Hakan', 'İrem', 'Kaan', 'Lale', 'Mert', 'Nur', 'Oğuz', 'Özge', 'Selin', 'Şule', 'Tolga', 'Ümit', 'Zeynep'];
  const LAST = ['Yılmaz', 'Kaya', 'Demir', 'Şahin', 'Çelik', 'Yıldız', 'Öztürk', 'Aydın', 'Arslan', 'Doğan', 'Kılıç', 'Koç'];
  const CITIES = ['İstanbul', 'Ankara', 'İzmir', 'Bursa', 'Antalya', 'Konya', 'Eskişehir', 'Trabzon'];
  const STATUS = [['new', 'Yeni'], ['paid', 'Ödendi'], ['shipped', 'Kargoda'], ['cancelled', 'İptal']];
  const CATEGORIES = ['Kırtasiye', 'Elektronik', 'Ev', 'Çanta'];
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = list => list[Math.floor(random() * list.length)];
  const fold = text => String(text).toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pad = n => String(n).padStart(2, '0');

  const orders = Array.from({ length: 5000 }, (_, i) => {
    const day = new Date(2026, 9, 24 - Math.floor(random() * 365), Math.floor(random() * 24), Math.floor(random() * 60));
    return {
      id: i + 1, customer: `${pick(FIRST)} ${pick(LAST)}`, city: pick(CITIES), status: pick(STATUS)[0],
      total: (Math.round(random() * 2_500_000) / 100).toFixed(2),
      ordered_at: `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())} ${pad(day.getHours())}:${pad(day.getMinutes())}:00`,
    };
  });

  // ---------- A fake server: the request format of the Laravel and Node back ends ----------
  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    if (!url.pathname.endsWith('/demo-api/orders')) return realFetch(input, init);
    await new Promise(resolve => setTimeout(resolve, 300));
    const q = url.searchParams;
    let rows = orders;
    for (let i = 0; q.has(`filters[${i}][field]`); i++) {
      const field = q.get(`filters[${i}][field]`), op = q.get(`filters[${i}][op]`);
      const value = q.get(`filters[${i}][value]`);
      const list = []; for (let j = 0; q.has(`filters[${i}][value][${j}]`); j++) list.push(q.get(`filters[${i}][value][${j}]`));
      const read = row => (field === 'total' ? Number(row.total) : field === 'ordered_at' ? row.ordered_at.slice(0, 10) : row[field]);
      const typed = v => (field === 'total' ? Number(v) : field === 'ordered_at' ? String(v).slice(0, 10) : v);
      rows = rows.filter(row => {
        const v = read(row);
        switch (op) {
          case 'contains': return fold(v).includes(fold(value));
          case 'eq': return v === typed(value);
          case 'in': return list.includes(String(v));
          case 'gte': return v >= typed(value);
          case 'lte': return v <= typed(value);
          case 'gt': return v > typed(value);
          case 'lt': return v < typed(value);
          case 'between': return v >= typed(list[0]) && v <= typed(list[1]);
          default: return true;
        }
      });
    }
    const words = (q.get('search') ?? '').match(/"[^"]+"|\S+/g) ?? [];
    for (const word of words.map(w => fold(w.replace(/"/g, '')))) rows = rows.filter(row => fold(`${row.customer} ${row.city}`).includes(word));
    const sort = (q.get('sort') ?? '').split(',').filter(Boolean).map(part => part.split(':'));
    if (sort.length) {
      const key = field => row => (field === 'total' ? Number(row.total) : field === 'ordered_at' ? row.ordered_at : fold(row[field]));
      rows = [...rows].sort((a, b) => {
        for (const [field, dir] of sort) { const x = key(field)(a), y = key(field)(b); if (x !== y) return (x < y ? -1 : 1) * (dir === 'desc' ? -1 : 1); }
        return a.id - b.id;
      });
    }
    const page = Number(q.get('page') ?? 1), size = Number(q.get('pageSize') ?? 25);
    const body = { rows: rows.slice((page - 1) * size, page * size), totalRows: rows.length };
    return new Response(JSON.stringify(body), { headers: { 'Content-Type': 'application/json' } });
  };

  const products = Array.from({ length: 300 }, (_, i) => ({
    id: i + 1,
    sku: `SKU-${String(i + 1).padStart(5, '0')}`,
    name: `${pick(['Defter', 'Kalem seti', 'Masa lambası', 'Sırt çantası', 'Termos', 'Kulaklık', 'Mouse', 'Ajanda', 'Kupa', 'Matara'])} ${pick(['Mavi', 'Siyah', 'Beyaz', 'Kırmızı', 'Yeşil'])}`,
    category: pick(CATEGORIES),
    supplier: `${pick(['Anadolu', 'Ege', 'Marmara', 'Karadeniz'])} ${pick(['Tedarik', 'Ticaret', 'Dağıtım'])}`,
    price: (Math.round(random() * 400_000) / 100 + 9.9).toFixed(2),
    stock: Math.floor(random() * 250),
    active: random() > 0.2,
    updated: `2026-${pad(1 + Math.floor(random() * 10))}-${pad(1 + Math.floor(random() * 28))}`,
  }));
  const people = Array.from({ length: 100_000 }, (_, i) => ({ id: i + 1, name: `${pick(FIRST)} ${pick(LAST)}`, city: pick(CITIES), score: Math.floor(random() * 1000), joined: `2026-${pad(1 + Math.floor(random() * 10))}-${pad(1 + Math.floor(random() * 28))}` }));

  // ---------- Texts: the page follows the table's language (i18n.js) ----------
  const { el } = AcunDataTable;
  const languageSelect = document.getElementById('language');
  const T = () => window.DEMO_I18N[languageSelect.value] ?? window.DEMO_I18N.tr;
  const lookup = (path, texts = T()) => path.split('.').reduce((node, key) => node?.[key], texts);
  const settings = () => ({ responsive: 'auto', language: languageSelect.value });
  const money = value => (value == null ? '' : Number(value).toLocaleString(T().locale, { style: 'currency', currency: 'TRY', currencyDisplay: 'narrowSymbol' }));
  const badge = value => el('span', { class: `badge badge--${value}` }, T().status[value] ?? String(value));
  const category = value => T().category[value] ?? String(value);

  // ---------- The tables (each code panel shows the options, without the shared settings) ----------
  const tables = {};
  const builders = {
    server: () => new AcunDataTable('#server', {
      ...settings(),
      serverSide: true,
      ajax: 'demo-api/orders',
      pagination: { pageSize: 25, pageSizes: [10, 25, 50, 100], firstLast: true },
      fixedHeader: true,
      selectable: true,
      stateSave: { key: 'demo-orders', storage: 'session' },
      buttons: ['excel', 'csv', 'copy', 'print'],
      exportFilename: T().exportName,
      columns: [
        { data: 'customer', title: T().col.customer, filter: true, priority: 1 },
        { data: 'city', title: T().col.city, filter: CITIES.map(city => ({ value: city, label: city })) },
        { data: 'total', title: T().col.total, type: 'decimal', filter: true, priority: 1, render: money },
        { data: 'status', title: T().col.status, filter: STATUS.map(([value]) => ({ value, label: T().status[value] })), cell: badge },
        { data: 'ordered_at', title: T().col.ordered, type: 'datetime', filter: true, priority: 3 },
      ],
      rowActions: [{ id: 'view', label: T().act.view, icon: 'view', iconOnly: true, onSelect: row => alert(T().act.order(row.id, row.original.customer)) }],
      bulkActions: [{ id: 'ship', label: T().act.ship, onSelect: ({ rows }) => alert(T().act.shipping(rows.length)) }],
    }),
    columns: () => new AcunDataTable('#columns', {
      ...settings(),
      data: products,
      pagination: { pageSize: 10, pageSizes: [10, 25, 50] },
      columnReorder: true,
      columnResize: true,
      fixedColumns: { start: 1, end: 1 },
      stateSave: { key: 'demo-columns', storage: 'session' },
      columns: [
        { data: 'name', title: T().col.product, priority: 1 },

  show(builders[first] ? first : 'server'); // #/columns, #/edit, #/virtual, #/mobile, #/frameworks open that scenario
  window.demoTables = tables; // for the browser tests
})();
</script>
