<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurulum — Acun DataTable</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root{
    --page:#eceef1; --bg:#ffffff; --fg:#161a20; --muted:#6b7280; --border:#e6e8ec;
    --rail:#111318; --rail-fg:#8b90a0; --rail-active:#ffffff; --rail-active-bg:#262a33;
    --side:#ffffff; --side-active:#f1f2f4; --accent:#4f46e5; --accent-weak:#eef0ff;
    --code-bg:#1b1f2b; --chip:#eef0f3;
  }
  :root[data-theme="dark"]{
    --page:#07090d; --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#20262f;
    --rail:#05070a; --rail-fg:#6b7280; --rail-active:#ffffff; --rail-active-bg:#1b2029;
    --side:#0d1117; --side-active:#1a2029; --accent:#8b83ff; --accent-weak:#1a1733;
    --code-bg:#0b0e14; --chip:#161b22;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--fg);background:var(--page)}
  a{color:inherit;text-decoration:none}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .app{display:grid;grid-template-columns:64px 288px 1fr;height:100vh}

  /* far-left icon rail */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .rail .logo{width:38px;height:38px;border-radius:11px;background:#262a33;display:grid;place-items:center;margin-bottom:10px}
  .rail .logo svg{width:20px;height:20px;color:#fff}
  .rail button{width:40px;height:40px;border:0;background:none;color:var(--rail-fg);border-radius:11px;display:grid;place-items:center;cursor:pointer}
  .rail button svg{width:20px;height:20px}
  .rail button:hover{color:#fff;background:#ffffff14}
  .rail button.active{color:var(--rail-active);background:var(--rail-active-bg)}
  .rail .grow{flex:1}
  .rail .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0b43a,#e07b39);margin-top:6px}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:auto}
  .side .head{padding:22px 20px 10px}
  .side h1{font-size:23px;margin:0 0 14px}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:14px}
  .search svg{width:16px;height:16px}
  .side .nav{padding:8px 12px 20px}
  .quick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer}
  .quick:hover{background:var(--side-active)}
  .quick svg{width:19px;height:19px;color:var(--muted)}
  .quick .badge{margin-left:auto;background:var(--chip);color:var(--muted);border-radius:7px;font-size:12px;font-weight:700;padding:2px 8px}
  .sec{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:16px 12px 6px}
  .fw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600}
  .fw:hover{background:var(--side-active)}
  .fw.active{background:var(--side-active)}
  .fw.active .name{color:var(--accent)}
  .fw .ic{width:30px;height:30px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
  .fw .ic svg{display:block}
  .fw small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px}

  /* content */
  .main{background:var(--bg);overflow:auto}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 32px;background:var(--bg);border-bottom:1px solid var(--border)}
  .crumb{color:var(--muted);font-size:13px}
  .topbar .grow{flex:1}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:var(--bg);color:var(--muted);padding:7px 11px;font-size:13px;cursor:pointer}
  .seg button.active{background:var(--accent);color:#fff}
  .ctl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer}
  .ctl:hover{border-color:var(--accent)}
  .doc{max-width:760px;padding:34px 32px 120px}
  .doc h1{font-size:28px;margin:.1em 0 .1em;display:flex;align-items:center;gap:14px}
  .doc h1 .big{width:44px;height:44px;border-radius:11px;background:var(--chip);display:grid;place-items:center;flex:none}
  .badge2{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-weak);border:1px solid var(--accent);border-radius:999px;padding:3px 9px}
  .lead{color:var(--muted);font-size:16px;margin:.5em 0 1.4em}
  h2.step{font-size:18px;margin:1.9em 0 .5em;display:flex;align-items:center;gap:10px}
  .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
  .codewrap{position:relative;margin:12px 0}
  pre{background:var(--code-bg);color:#e6edf3;border-radius:11px;padding:16px 18px;overflow:auto;margin:0;font-size:13.5px;line-height:1.55}
  .copy{position:absolute;top:8px;right:8px;border:1px solid #ffffff22;background:#ffffff14;color:#cfd6e4;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
  .copy:hover{background:#ffffff26}
  .note{border:1px solid var(--border);background:var(--chip);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;margin:14px 0;font-size:14px;color:var(--muted)}
  .next{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .next a{border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:14px}
  .next a:hover{border-color:var(--accent);color:var(--accent)}

  /* mobile framework selector (horizontal, scrollable) */
  .fwbar{display:none}
  .fwbar button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .fwbar button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
  .fwbar button .ic{width:20px;height:20px;display:grid;place-items:center}

  /* ≤980px: drop the sidebar, switch to the horizontal selector */
  @media(max-width:980px){
    .app{grid-template-columns:64px 1fr}
    .side{display:none}
    .topbar{position:static;flex-wrap:wrap}
    .fwbar{display:flex;gap:8px;overflow-x:auto;padding:12px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:4;-webkit-overflow-scrolling:touch}
    .doc{padding:26px 24px 90px}
  }
  /* ≤640px: drop the icon rail too, full-width content */
  @media(max-width:640px){
    .app{grid-template-columns:1fr;height:auto;min-height:100vh}
    .rail{flex-direction:row;height:auto;padding:8px 10px;gap:4px;overflow-x:auto}
    .rail .logo{margin-bottom:0}
    .rail .grow{display:none}
    .rail{display:none}
    .fwbar{padding:12px 16px}
    .topbar{padding:12px 16px}
    .doc{padding:22px 16px 80px}
    .doc h1{font-size:23px}
    .doc h1 .big{width:38px;height:38px}
    pre{font-size:12.5px}
  }
</style>

`import { useDataTable, DataTable } from '@acunsoft/datatable-react';
import { createColumns } from '@acunsoft/datatable-core';

const columns = createColumns<Order>([
  { id: 'customer', header: 'Müşteri', accessorKey: 'customer', enableSorting: true },
  { id: 'total', header: 'Tutar', accessorKey: 'total', enableSorting: true },
]);

export function Orders({ rows }: { rows: Order[] }) {
  const table = useDataTable({ rows, columns, getRowId: r => r.id,
    initialState: { page: 1, pageSize: 25 } });
  return <DataTable table={table} />;
}` },

`import { createColumns, createRows, createLocalRowModel, paginateRows } from '@acunsoft/datatable-core';
import { renderTable } from '@acunsoft/datatable-dom';

  { id: 'customer', header: 'Müşteri', accessorKey: 'customer', enableSorting: true },

  const bar=$('#fwbar'); bar.innerHTML='';
  FW.forEach(f=>{
    const b=document.createElement('button');
    b.className='fw'+(f.id===current?' active':'');
    b.innerHTML=`<span class="ic">${f.ico}</span><span class="name">${f.name}<small>${f.tag[lang]}</small></span>`;
    b.onclick=()=>{ current=f.id; persist(); renderList(); renderGuide(); };
    el.appendChild(b);
    // compact chip for the mobile selector
    const m=document.createElement('button');
    m.className=(f.id===current?'active':'');
    m.innerHTML=`<span class="ic">${f.ico}</span>${f.name}`;
    m.onclick=()=>{ current=f.id; persist(); renderList(); renderGuide();
      m.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); };
    bar.appendChild(m);
  });
}
function renderGuide(){
  const f=FW.find(x=>x.id===current), t=UI[lang];
  $('#fw-big').innerHTML=f.ico; $('#crumb-fw').textContent=f.name;
  $('#fw-title').textContent=f.name;
  const badge=$('#fw-badge'); badge.textContent=f.preview?t.preview:t.core;
  $('#fw-lead').innerHTML=f.lead[lang];
  $('#c-install').textContent=f.install; $('#c-install').className='language-bash';
  $('#install-note').innerHTML=f.note[lang];
  const cu=$('#c-usage'); cu.textContent=f.code; cu.className='language-'+f.lang;
  $('#next').innerHTML=t.nexts.map(([n,h])=>`<a href="${h}">${n} →</a>`).join('');
  document.querySelectorAll('pre code').forEach(b=>{try{delete b.dataset.highlighted;hljs.highlightElement(b);}catch(e){}});
  applyI18n();
}
function applyI18n(){
  const t=UI[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(typeof t[k]==='string')el.textContent=t[k];});
  document.querySelectorAll('.copy').forEach(c=>c.textContent=t.copy);
  document.documentElement.lang=lang;
}
function persist(){try{localStorage.setItem('adt-lang',lang);localStorage.setItem('adt-fw2',current);}catch(e){}}

document.querySelectorAll('#lang button').forEach(btn=>{
  btn.classList.toggle('active',btn.dataset.lang===lang);
  btn.onclick=()=>{lang=btn.dataset.lang;persist();
    document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active',b===btn));
    renderList();renderGuide();applyTheme();};
});
let theme='light';
try{theme=localStorage.getItem('adt-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}catch(e){}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);
  const th=$('#theme');th.firstChild.textContent=theme==='dark'?'☀ ':'🌙 ';
  th.querySelector('[data-i=theme]').textContent=lang==='tr'?(theme==='dark'?'Açık':'Koyu'):(theme==='dark'?'Light':'Dark');}
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('adt-theme',theme);}catch(e){}applyTheme();};
document.addEventListener('click',e=>{
  const btn=e.target.closest('.copy');if(!btn)return;
  const code=document.getElementById(btn.dataset.copy).textContent;
  navigator.clipboard?.writeText(code).then(()=>{btn.textContent=UI[lang].copied;setTimeout(()=>btn.textContent=UI[lang].copy,1200);}).catch(()=>{});
});
document.documentElement.setAttribute('data-theme',theme);
renderList();renderGuide();applyTheme();
</script>
</body>
</html>
