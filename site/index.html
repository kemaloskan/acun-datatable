<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acun DataTable — Dokümantasyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root{
    --brand:#794dff;
    --brand-soft:color-mix(in srgb,var(--brand) 7%,white);
    --brand-text:var(--brand);
    --ink:#141b2d; --text:#2b3142; --muted:#5b6273; --faint:#858b98;
    --line:#e3e6eb; --line-strong:#d1d6de;
    --surface:#ffffff; --surface-subtle:#f7f8fa; --surface-hover:#f1f3f6;
    --code-bg:#141414; --code-line:#2e2e2e; --code-text:#e5e5e5;
    --shadow-sm:0 1px 2px rgba(20,27,45,.06),0 4px 14px rgba(20,27,45,.05);
    --radius:6px; --topbar:72px;
    --sans:'Public Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --brand-soft:color-mix(in srgb,var(--brand) 18%,var(--surface));
      --brand-text:color-mix(in srgb,var(--brand) 66%,white);
      --ink:#f5f5f5; --text:#d4d4d4; --muted:#b4b4b4; --faint:#8c8c8c;
      --line:#262626; --line-strong:#3a3a3a;
      --surface:#0a0a0a; --surface-subtle:#141414; --surface-hover:#1f1f1f;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --brand-soft:color-mix(in srgb,var(--brand) 18%,var(--surface));
    --brand-text:color-mix(in srgb,var(--brand) 66%,white);
    --ink:#f5f5f5; --text:#d4d4d4; --muted:#b4b4b4; --faint:#8c8c8c;
    --line:#262626; --line-strong:#3a3a3a;
    --surface:#0a0a0a; --surface-subtle:#141414; --surface-hover:#1f1f1f;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font:15px/1.65 var(--sans);color:var(--text);background:var(--surface);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  code{font-family:var(--mono)}

  /* ---------- header ---------- */
  .top{position:sticky;top:0;z-index:30;height:var(--topbar);display:flex;align-items:center;gap:24px;padding:0 40px;background:var(--surface);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
  .logo .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#9b7bff,var(--brand));display:grid;place-items:center}
  .logo .mk svg{width:18px;height:18px;color:#fff}
  .tnav{flex:1;display:flex;justify-content:center;gap:34px;height:100%}
  .tnav a{display:flex;align-items:center;height:100%;font-size:15px;font-weight:500;color:var(--text);border-bottom:2px solid transparent;cursor:pointer}
  .tnav a:hover{color:var(--ink)}
  .tnav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
  .tools{display:flex;align-items:center;gap:6px}
  .ib{height:40px;min-width:40px;padding:0 10px;border:0;background:none;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--text);font-size:14px;font-weight:600}
  .ib:hover{background:var(--surface-hover)}
  .ib svg{width:19px;height:19px}
  .cta{height:38px;padding:0 16px;border:0;border-radius:var(--radius);background:var(--brand);color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-left:6px;white-space:nowrap}
  .cta:hover{filter:brightness(1.07)}
  .burger{display:none}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr) 250px;max-width:1520px;margin:0 auto}
  .side{position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow:auto;border-right:1px solid var(--line);padding:30px 22px 40px 40px}
  .grp{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px}
  .grp:first-child{margin-top:4px}
  .nv{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px;margin-bottom:6px;border:0;background:none;border-radius:var(--radius);font-size:14.5px;line-height:1.5;color:var(--text);cursor:pointer;text-align:left}
  .nv:hover{background:var(--surface-hover);color:var(--ink)}
  .nv.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
  .nv .fi{width:20px;height:20px;display:grid;place-items:center;flex:none}
  .nv .fi svg{display:block}

  .content{min-width:0;padding:56px 72px 140px}
  .toc{position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow:auto;padding:60px 32px 40px 8px}
  .toc h4{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--ink)}
  .toc ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .toc li a{display:block;padding:6px 0 6px 16px;margin-left:-1px;border-left:2px solid transparent;font-size:14px;color:var(--muted);cursor:pointer}
  .toc li a:hover{color:var(--ink)}
  .toc li a.on{color:var(--ink);font-weight:600;border-left-color:var(--brand)}

  /* mobile in-content "on this page" chips */
  .chips{display:none}

  /* ---------- content typography ---------- */
  /* one type scale for the whole page:
     xs 12 · sm 13 · base 15 · md 17 · h2 22 · h1 30 */
  .content h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;color:var(--ink);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .content h1 .hi{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-subtle);display:grid;place-items:center;flex:none}
  .lead{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 16px;max-width:760px}
  .meta{font-family:var(--mono);font-size:13px;color:var(--faint);display:flex;gap:20px;flex-wrap:wrap;margin-bottom:4px}
  .pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:0;line-height:1.5;color:var(--brand-text);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:999px;padding:1px 9px;vertical-align:middle}
  section{border-top:1px solid var(--line);margin-top:36px;padding-top:26px;scroll-margin-top:calc(var(--topbar) + 16px)}
  .sh{display:grid;grid-template-columns:44px 1fr;align-items:baseline}
  .sh .n{font-family:var(--mono);font-size:13px;color:var(--brand-text)}
  .sh h2{font-size:22px;letter-spacing:-.015em;color:var(--ink);margin:0;line-height:1.3;font-weight:700}
  .sh p{margin:4px 0 0;color:var(--muted);font-size:15px}
  .body{margin-top:18px}
  .body p{margin:0 0 12px}
  .body code:not(pre code){background:var(--surface-subtle);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px;color:var(--ink)}
  .lead code,.note code{font-size:.9em}

  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface);cursor:default}
  .card.link{cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .card.link:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
  .card.feat{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
  .card .ct{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .card .lb{font-family:var(--mono);font-size:12px;color:var(--brand-text);overflow-wrap:anywhere}
  .card h3{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
  .card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55;flex:1}
  .card .go{color:#3267e3;font-weight:600;font-size:14px}
  :root[data-theme="dark"] .card .go{color:#8fb0ff}
  .card .ico{width:30px;height:30px;border-radius:7px;background:var(--surface-subtle);border:1px solid var(--line);display:grid;place-items:center}

  .codewrap{position:relative;margin:12px 0 16px}
  .codewrap pre{margin:0;background:var(--code-bg);border:1px solid var(--code-line);border-radius:var(--radius);padding:16px 18px;overflow:auto;font-size:13px;line-height:1.65}
  .codewrap pre code{font-family:var(--mono);color:var(--code-text);background:none!important;padding:0!important}
  .codewrap .cap{position:absolute;top:0;left:0;right:0;height:0}
  .copy{position:absolute;top:10px;right:10px;border:1px solid #3a3a3a;background:#1f1f1f;color:#d4d4d4;border-radius:5px;padding:4px 10px;font-size:12px;font-family:var(--mono);cursor:pointer;opacity:0;transition:opacity .15s}
  .codewrap:hover .copy,.copy:focus-visible{opacity:1}
  .copy:hover{background:#2a2a2a}
  @media (hover:none){.copy{opacity:1}}
  .note{border:1px solid var(--line);border-left:3px solid var(--brand);background:var(--surface-subtle);border-radius:var(--radius);padding:11px 15px;color:var(--muted);font-size:14px;line-height:1.6;margin:12px 0}
  .note.warn{border-left-color:#c48214}
  .api{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .api .r{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
  .api .r:first-child{border-top:0}
  .api code{color:var(--brand-text);font-size:13px}
  .api span{color:var(--muted)}
  h3.sub{font-size:17px;font-weight:700;color:var(--ink);margin:22px 0 4px}

  .backdrop{display:none}

  /* ---------- responsive ---------- */
  @media (max-width:1280px){
    .layout{grid-template-columns:280px minmax(0,1fr)}
    .toc{display:none}
    .chips{display:flex;gap:8px;overflow-x:auto;position:sticky;top:var(--topbar);z-index:10;background:var(--surface);margin:0 -72px 28px;padding:12px 72px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
    .chips a{flex:none;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
    .chips a.on{color:var(--brand-text);border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-soft)}
    .content{padding:44px 72px 120px}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:960px){
    .top{padding:0 18px;gap:12px}
    .tnav{display:none}
    .tools{margin-left:auto}
    .burger{display:inline-flex}
    .cta{display:none}
    .layout{grid-template-columns:minmax(0,1fr)}
    .side{position:fixed;left:0;top:var(--topbar);bottom:0;height:auto;width:min(300px,86vw);z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .2s;padding:24px 18px 40px}
    .side.open{transform:none;box-shadow:var(--shadow-sm)}
    .backdrop.open{display:block;position:fixed;inset:var(--topbar) 0 0 0;background:rgba(10,12,20,.35);z-index:35}
    .content{padding:32px 20px 100px}
    .chips{margin:0 -20px 24px;padding:12px 20px}
    .content h1{font-size:26px}
    .lead{font-size:16px}
    .sh{grid-template-columns:36px 1fr}
    .sh h2{font-size:20px}
    .cards{grid-template-columns:minmax(0,1fr)}
    .api .r{grid-template-columns:1fr;gap:4px}
  }
  @media (max-width:520px){
    .logo span.t{display:none}
    .content h1{font-size:24px}
    .content h1 .hi{width:34px;height:34px}
    .codewrap pre{font-size:12px}
    .meta{gap:12px}
  }
.legal{margin-top:56px;padding-top:18px;border-top:1px solid var(--line, #e3e6eb);font-size:12.5px;line-height:1.6;color:var(--muted, #6b7280)}
.legal strong{display:block;margin-bottom:4px;font-size:12.5px}
.legal p{margin:0;max-width:72ch}
</style>
</head>
<body>
<header class="top">
  <button class="ib burger" id="burger" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="logo" href="#/home"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></span><span class="t">Acun DataTable</span></a>
  <nav class="tnav" id="tnav"></nav>
  <div class="tools">
    <button class="ib" id="lang" aria-label="Dil"></button>
    <button class="ib" id="theme" aria-label="Tema"></button>
    <button class="cta" id="cta"></button>
  </div>
</header>

<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="content" id="content"></main>
  <aside class="toc" id="toc"></aside>
</div>
<div class="backdrop" id="backdrop"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
/* ======================= data ======================= */
const ICON = {
  home:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  api:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg>`,
  vue:`<svg width="18" height="18" viewBox="0 0 196 170"><path d="M120 0 98 38 76 0H0l98 170L196 0z" fill="#41B883"/><path d="M120 0 98 38 76 0H38l60 104L158 0z" fill="#35495E"/></svg>`,
  react:`<svg width="20" height="20" viewBox="-11.5 -10.23 23 20.46" fill="none"><circle r="2.05" fill="#149eca"/><g stroke="#149eca" stroke-width="1"><ellipse rx="11" ry="4.2"/><ellipse rx="11" ry="4.2" transform="rotate(60)"/><ellipse rx="11" ry="4.2" transform="rotate(120)"/></g></svg>`,
  html:`<svg width="17" height="17" viewBox="0 0 512 512"><path fill="#E34F26" d="M71 460 30 0h452l-41 460-185 52z"/><path fill="#EF652A" d="M256 472l149-41 35-394H256z"/><path fill="#fff" d="M256 208h-75l-5-53h80v-52H119l15 157h122zm0 134-63-17-4-45h-52l7 89 112 31z"/><path fill="#EBEBEB" d="M256 208v52h70l-7 73-63 17v54l112-31 15-165zm0-105v52h132l4-52z"/></svg>`,
  livewire:`<svg width="18" height="18" viewBox="0 0 24 24" fill="#FB70A9"><path d="M13 2 4.5 13H11l-1 9 9-12h-6z"/></svg>`,
  laravel:`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF2D20" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7l4.5-2.5L12 7 7.5 9.5z"/><path d="M3 7v5l4.5 2.5V9.5"/><path d="M12 7v5l-4.5 2.5"/><path d="M12 7l4.5-2.5L21 7l-4.5 2.5z"/><path d="M16.5 9.5V15L12 17.5"/></svg>`
};

const FEATURES = {
  tr:[["Headless çekirdek","DOM ve framework'ten bağımsız saf TypeScript; istediğin renderer veya adapter ile kullan."],
      ["Değişmez state","Her değişim donmuş bir snapshot üretir; çağıranın verisi asla mutasyona uğramaz."],
      ["Kararlı sıralama","Çok kolonlu, locale-duyarlı (ör. Türkçe), stable sıralama; eşitlikte giriş sırası korunur."],
      ["Filtre, arama, sayfalama","contains/eq/gt/lt filtreleri ve global arama; 1-tabanlı sayfalar, sınır-dışı sayfa son sayfaya clamp edilir."],
      ["Güvenli varsayılan","Hücre içeriği metin olarak basılır; güvenilmeyen HTML enjekte edilmez."],
      ["Tip-güvenli","Kolon tanımları ve satır kimlikleri TypeScript ile tam tiplenir."]],
  en:[["Headless core","Pure TypeScript, free of DOM and frameworks; use it with any renderer or adapter."],
      ["Immutable state","Every change yields a frozen snapshot; caller-owned data is never mutated."],
      ["Stable sorting","Multi-column, locale-aware (e.g. Turkish), stable sorting; ties keep input order."],
      ["Filter, search, paginate","contains/eq/gt/lt filters and global search; 1-based pages, an out-of-range page clamps to the last one."],
      ["Secure by default","Cell content renders as text; untrusted HTML is never injected."],
      ["Type-safe","Column definitions and row IDs are fully typed with TypeScript."]]
};

const API = [
  ['@acunsoft/datatable-core', [
    ["createDataTable({ data, columns, mode? })", {tr:"Hepsi bir arada tablo: yerel veya sunucu modu; sıralama, filtre, arama, sayfa, seçim; işlem başına bir olay.", en:"All-in-one table, local or server mode: sorting, filters, search, pages, selection; one event per action."}],
    ["table.setColumnVisibility(id, visible) · getVisibleColumns()", {tr:"Kolon gizleme; gizli kolonlar sıralama, filtre ve aramada kalır, sorgu değişmez.", en:"Column hiding; hidden columns still sort, filter and search, the query is unchanged."}],
    ["createColumns(definitions)", {tr:"Kolon tanımlarını doğrular, kopyalar ve dondurur; type: text, number, decimal, date, boolean.", en:"Validates, copies and freezes column definitions; type: text, number, decimal, date, boolean."}],
    ["createRows(data, { getRowId? })", {tr:"Kararlı satır kimlikleri üretir; veriyi klonlamaz.", en:"Builds stable row identities; never clones caller data."}],
    ["createLocalRowModel(rows, columns, options?)", {tr:"Yerel çok kolonlu, kararlı, doğal sıralama + önbellek.", en:"Local multi-column, stable, natural sorting with caching."}],
    ["filterRows(rows, columns, { filters, globalSearch })", {tr:"contains, startsWith, eq, gt, lt, between, in, empty, notEmpty; Türkçe duyarlı akıllı arama.", en:"contains, startsWith, eq, gt, lt, between, in, empty, notEmpty; Turkish-aware smart search."}],
    ["paginateRows(rows, { page, pageSize })", {tr:"1 tabanlı sayfa dilimi ve sayfa bilgisi; sınır dışı sayfa son sayfaya çekilir.", en:"1-based page slice plus page metadata; out-of-range pages are clamped."}],
    ["createPagination(page?, pageSize?)", {tr:"Doğrulanmış, donmuş { page, pageSize } değeri.", en:"Validated, frozen { page, pageSize } value."}],
    ["createTableState(options?)", {tr:"Değişmez state: page, pageSize, sorting; subscribe ve destroy.", en:"Immutable state: page, pageSize, sorting; subscribe and destroy."}],
    ["createRowSelection({ mode })", {tr:"Kararlı ID'lerle tekli/çoklu seçim; değişiklik olayı ve none/some/all durumu.", en:"Single/multiple selection by stable IDs; change events and none/some/all status."}],
    ["createTableQuery(state)", {tr:"Sunucuya gidecek doğrulanmış sorgu; geçersiz operatör ve boş filtreler elenir.", en:"Validated query for a server; invalid operators and empty filters are rejected or dropped."}],
    ["validatePageResult(value, { pageSize })", {tr:"Sunucu yanıtını { rows, totalRows } kontratına göre denetler.", en:"Checks a server response against the { rows, totalRows } contract."}],
    ["normalizeValue(value, type) · splitSearchTerms(text)", {tr:"Kolon tipine göre değer okuma ve akıllı arama ayrıştırma; sunucu ve adapter'lar için.", en:"Read a value as a column type and split smart-search text; for servers and adapters."}],
  ]],
  ['@acunsoft/datatable-http', [
    ["createHttpDataSource({ url, headers?, parseResponse? })", {tr:"fetch ile salt okunur veri kaynağı; sayfa boyutu sınırı, HttpError, yanıt doğrulama.", en:"Read-only fetch data source; page-size limit, HttpError, response validation."}],
    ["createQueryRunner(source)", {tr:"En son istek kazanır; iptal, yükleniyor/hata durumları, elle tekrar deneme.", en:"Latest request wins; abort, loading/error states, explicit retry."}],
    ["connectTable(table, runner)", {tr:"Sunucu modundaki tabloyu runner'a bağlar; ilk sayfayı yükler.", en:"Wires a server-mode table to the runner; loads the first page."}],
    ["serializeTableQuery(query) · formatLocalDate(date)", {tr:"Laravel/qs uyumlu sorgu parametreleri; tarihler yerel saatle.", en:"Laravel/qs-friendly query parameters; dates in local time."}],
  ]],
  ['@acunsoft/datatable-dom', [
    ["renderTable(container, table, options?)", {tr:"Erişilebilir <table>: sıralama butonları, seçim kutuları, odak koruma.", en:"Accessible <table>: sort buttons, selection checkboxes, focus kept."}],
    ["renderColumnToggle(container, table, options?)", {tr:"\"Kolonlar\" menüsü: her kolon için etiketli bir onay kutusu; son görünen kolon gizlenemez.", en:"\"Columns\" menu: a labelled checkbox per column; the last visible column cannot be hidden."}],
    ["renderBulkActions(container, table, { actions })", {tr:"Seçim varken görünen çubuk: \"3 seçili\", toplu işlem butonları, seçimi temizle. renderTable'a rowActions ile satır butonları eklenir.", en:"A bar shown while rows are selected: \"3 selected\", bulk action buttons, clear selection. renderTable's rowActions adds per-row buttons."}],
    ["renderPagination(container, table, options?)", {tr:"Önceki/sonraki, canlı durum metni, sayfa boyutu seçimi.", en:"Previous/next, live status, page-size select."}],
    ["renderSearch(container, table, options?)", {tr:"Gecikmeli arama kutusu; Enter hemen uygular.", en:"Debounced search box; Enter applies at once."}],

const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ALIASES = { livewire: 'laravel' }; // Livewire is part of the Laravel package
const route = () => { let r = (location.hash.match(/^#\/([a-z]+)/) || [])[1]; r = ALIASES[r] || r; return (r && (r === 'home' || r === 'api' || FW[r])) ? r : 'home'; };

/* ======================= builders ======================= */
const code = (src, l) => `<div class="codewrap"><pre><code class="language-${l}">${esc(src)}</code></pre><button class="copy">${T[lang].copy}</button></div>`;
const sec = (id, n, title, desc, body) =>
  `<section id="${id}"><div class="sh"><span class="n">${String(n).padStart(2,'0')}</span><div><h2>${title}</h2>${desc ? `<p>${desc}</p>` : ''}</div></div><div class="body">${body}</div></section>`;
const featCards = () => `<div class="cards">${FEATURES[lang].map(([h,p],i)=>`<div class="card${i===0?' feat':''}"><span class="lb">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}</div>`;
const apiList = (only) => API.filter(([pkg]) => !only || pkg === only).map(([pkg, items]) =>
  `${only ? '' : `<h3 class="sub">${esc(pkg)}</h3>`}<div class="api">${items.map(([sig,d])=>`<div class="r"><code>${esc(sig)}</code><span>${esc(d[lang])}</span></div>`).join('')}</div>`).join('');

function page(r) {
  const t = T[lang];
  if (r === 'home') {
    const cards = FW_ORDER.map((id,i) => { const f = FW[id];
      return `<a class="card link${i===0?' feat':''}" href="#/${id}" data-go="${id}"><div class="ct"><span class="ico">${ICON[id]}</span><h3>${f.name}</h3></div><span class="lb">${esc(f.pkg)}</span><p>${esc(t.fw_desc[id])}</p><span class="go">${t.go}</span></a>`; }).join('');
    return { toc:[['s1',t.h_s1],['s2',t.h_s2],['s3',t.h_s3]], html:
      `<h1>${t.h_title}</h1><p class="lead">${t.h_lead}</p><div class="meta"><span>${t.h_meta}</span><span>${t.updated}</span></div>` +
      sec('s1',1,t.h_s1,t.h_s1d,`<div class="cards">${cards}</div><p style="margin-top:18px">${t.h_core_install} <code>npm install @acunsoft/datatable-core</code></p>`) +
      sec('s2',2,t.h_s2,t.h_s2d,featCards()) +
      sec('s3',3,t.h_s3,t.h_s3d,code(EX_TABLE,'typescript')) };
  }
  if (r === 'api') {
    return { toc:[['a1',t.a_s1],['a2',t.a_s2]], html:
      `<h1><span class="hi">${ICON.api}</span>${t.api_title}</h1><p class="lead">${t.api_lead}</p><div class="meta"><span>@acunsoft/datatable-core</span><span>${t.updated}</span></div>` +
      sec('a1',1,t.a_s1,t.a_s1d,apiList()) +
      sec('a2',2,t.a_s2,t.a_s2d,code(EX_TABLE,'typescript')+code(EX_SORT,'typescript')+code(EX_STATE,'typescript')) };
  }
  const f = FW[r];
  return { toc:[['install',t.s_install],['usage',t.s_usage],['features',t.s_features],['examples',t.s_examples],['api',t.s_api]], html:
    `<h1><span class="hi">${ICON[r]}</span>${f.name}${f.status === 'ready' ? '' : ` <span class="pill">${t.preview}</span>`}</h1><p class="lead">${f.lead[lang]}</p><div class="meta"><span>${esc(f.pkg)}</span><span>${t.updated}</span></div>` +
    (f.status === 'ready' ? '' : `<div class="note warn" style="margin-top:22px">${t.prevNote}</div>`) +
    sec('install',1,t.s_install,t.d_install,
      (f.status === 'ready' ? `<p>${f.unpub ? f.unpub[lang] : t.unpub}</p>${code(f.install,'bash')}` : `<p>${t.planned_install}</p>`) + `<div class="note">${f.note[lang]}</div>`) +
    sec('usage',2,t.s_usage,t.d_usage,code(f.code,f.lang)) +
    sec('features',3,t.s_features,t.d_features,`<p>${esc(t.feat_for(f.name))}</p>`+featCards()) +
    sec('examples',4,t.s_examples,t.d_examples, f.examples
      ? f.examples.map(x => `<h3 class="sub">${esc(x.title[lang])}</h3><p>${esc(x.desc[lang])}</p>${code(x.code,x.lang)}`).join('')
      : `<h3 class="sub">${t.ex1}</h3><p>${t.ex1d}</p>${code(EX_SORT,'typescript')}<h3 class="sub">${t.ex2}</h3><p>${t.ex2d}</p>${code(EX_STATE,'typescript')}`) +
    sec('api',5,t.s_api,t.d_api,apiList(f.api ?? (f.status === 'ready' ? undefined : '@acunsoft/datatable-core'))) };
}

/* ======================= render ======================= */
function renderHeader(r) {
  const t = T[lang];
  const first = FW_ORDER[0];
  const tn = [['home',t.nav_start],[first,t.nav_fw],['api',t.nav_api]];
  const active = r === 'home' ? 'home' : r === 'api' ? 'api' : first;
  $('#tnav').innerHTML = tn.map(([id,l]) => `<a href="#/${id}" data-go="${id}" class="${id===active?'on':''}"${id===active?' aria-current="page"':''}>${l}</a>`).join('');
  $('#lang').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>${lang.toUpperCase()}`;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme').innerHTML = dark
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  $('#cta').textContent = t.cta;
  document.documentElement.lang = lang;
}
function renderSide(r) {
  const t = T[lang];
  const item = (id, label, ico) => `<a class="nv${id===r?' on':''}" href="#/${id}" data-go="${id}"${id===r?' aria-current="page"':''}><span class="fi">${ico}</span>${label}</a>`;
  $('#side').innerHTML =
    `<div class="grp">${t.g_start}</div>${item('home',t.home,ICON.home)}` +
    `<div class="grp">${t.g_fw}</div>${FW_ORDER.map(id=>item(id,FW[id].name,ICON[id])).join('')}` +
    `<div class="grp">${t.g_core}</div>${item('api',t.api,ICON.api)}`;
}
let tocIds = [];
function renderPage(r) {
  const t = T[lang], p = page(r);
  tocIds = p.toc.map(x => x[0]);
  const chips = `<nav class="chips" id="chips" aria-label="${esc(t.toc)}">${p.toc.map(([id,l]) => `<a href="#/${r}/${id}" data-to="${id}">${esc(l)}</a>`).join('')}</nav>`;
  $('#content').innerHTML = chips + p.html + `<footer class="legal"><strong>${T[lang].legal_title}</strong><p>${T[lang].legal}</p></footer>`;
  $('#toc').innerHTML = `<h4>${t.toc}</h4><ul>${p.toc.map(([id,l]) => `<li><a href="#/${r}/${id}" data-to="${id}">${esc(l)}</a></li>`).join('')}</ul>`;
  document.querySelectorAll('#content pre code').forEach(b => { try { hljs.highlightElement(b); } catch (e) {} });
  document.title = r === 'home' ? 'Acun DataTable' : (FW[r] ? FW[r].name : t.api) + ' — Acun DataTable';
  spy();
}
/** `#/vue/install` deep-links to a section of a page. */
const sectionFromHash = () => (location.hash.match(/^#\/[a-z]+\/([a-z0-9-]+)/) || [])[1];
let rendered = null;
function render(scrollTop) {
  const r = route();
  if (r !== rendered) { renderHeader(r); renderSide(r); renderPage(r); rendered = r; }
  const target = sectionFromHash() && document.getElementById(sectionFromHash());
  if (target) target.scrollIntoView({ block: 'start' });
  else if (scrollTop) window.scrollTo({ top: 0, behavior: 'instant' });
}

/* scroll spy: highlight the section currently under the header */
function spy() {
  if (!tocIds.length) return;
  const limit = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar')) + 90;
  let cur = tocIds[0];
  for (const id of tocIds) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= limit) cur = id; }
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = tocIds[tocIds.length - 1];
  document.querySelectorAll('[data-to]').forEach(a => a.classList.toggle('on', a.dataset.to === cur));
  const chip = document.querySelector('#chips a.on');
  if (chip) chip.scrollIntoView({ block:'nearest', inline:'nearest' });
}
window.addEventListener('scroll', spy, { passive:true });

/* ======================= events ======================= */
function closeSide(){ $('#side').classList.remove('open'); $('#backdrop').classList.remove('open'); }
document.addEventListener('click', (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // let new-tab clicks through
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); closeSide(); const id = go.dataset.go; if (route() === id && !sectionFromHash()) window.scrollTo({top:0}); else location.hash = '#/' + id; return; }
  const to = e.target.closest('[data-to]');
  if (to) { e.preventDefault(); history.replaceState(null, '', to.getAttribute('href')); const el = document.getElementById(to.dataset.to); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  const cp = e.target.closest('.copy');
  if (cp) { const txt = cp.parentElement.querySelector('code').textContent;
    navigator.clipboard?.writeText(txt).then(() => { cp.textContent = T[lang].copied; setTimeout(() => cp.textContent = T[lang].copy, 1200); }).catch(() => {}); }
});
$('#burger').onclick = () => { $('#side').classList.toggle('open'); $('#backdrop').classList.toggle('open'); };
$('#backdrop').onclick = closeSide;
$('#cta').onclick = () => { location.hash = '#/home/s1'; };
$('#lang').onclick = () => { lang = lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('adt-lang', lang); } catch (e) {} rendered = null; render(false); };
$('#theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('adt-theme', next); } catch (e) {}
  renderHeader(route());
};
window.addEventListener('hashchange', () => render(true));
render(false);
// The browser settles the initial scroll position after load; apply a deep
// link (#/page/section) once that has happened.
window.addEventListener('load', () => {
  const target = sectionFromHash() && document.getElementById(sectionFromHash());
  if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
});
</script>
</body>
</html>
