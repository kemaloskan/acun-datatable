<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurulum — Acun DataTable</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root{
    --bg:#ffffff; --fg:#161a20; --muted:#6b7280; --border:#e6e8ec;
    --rail:#111318; --rail-fg:#9aa0ae; --rail-active-bg:#262a33;
    --side:#ffffff; --side-active:#f1f2f4; --accent:#4f46e5; --accent-weak:#eef0ff;
    --code-bg:#1b1f2b; --chip:#eef0f3;
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#20262f;
    --rail:#05070a; --rail-fg:#737a86; --rail-active-bg:#1b2029;
    --side:#0d1117; --side-active:#1a2029; --accent:#8b83ff; --accent-weak:#1a1733;
    --code-bg:#0b0e14; --chip:#161b22;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg)}
  a{color:inherit;text-decoration:none}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit}
  .app{display:grid;grid-template-columns:96px 262px 1fr;height:100vh}

  /* far-left item rail */
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:6px;overflow:auto}
  .rail .fw{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;padding:10px 4px;border:0;background:none;color:var(--rail-fg);border-radius:13px;cursor:pointer;font-size:11px;font-weight:600;flex:none;text-align:center}
  .rail .fw .ic{width:38px;height:38px;border-radius:10px;background:#ffffff12;display:grid;place-items:center}
  .rail .fw .ic svg{display:block}
  .rail .fw:hover{background:#ffffff12;color:#fff}
  .rail .fw.active{background:var(--rail-active-bg);color:#fff}
  .rail .fw.active .ic{box-shadow:0 0 0 2px var(--accent) inset}
  .rail .sep{width:46px;height:1px;background:#ffffff14;margin:4px 0;flex:none}
  .rail .grow{flex:1;min-height:6px}
  .rail .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0b43a,#e07b39);margin-top:4px;flex:none}

  /* middle sidebar: sections of current item */
  .side{background:var(--side);border-right:1px solid var(--border);overflow:auto;padding:22px 14px}
  .side h2{font-size:21px;margin:0 16px 6px;display:flex;align-items:center;gap:10px}
  .side h2 .ic{width:26px;height:26px;display:grid;place-items:center}
  .side .sub{color:var(--muted);font-size:13px;margin:0 16px 16px}
  .side .sec{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600}
  .side .sec:hover{background:var(--side-active)}
  .side .sec.active{background:var(--side-active);color:var(--accent)}
  .side .sec .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
  .side .sec.active .dot{opacity:1}

  /* content */
  .main{background:var(--bg);overflow:auto;min-width:0}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 32px;background:var(--bg);border-bottom:1px solid var(--border)}
  .crumb{color:var(--muted);font-size:13px}
  .topbar .grow{flex:1}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:var(--bg);color:var(--muted);padding:7px 11px;font-size:13px;cursor:pointer}
  .seg button.active{background:var(--accent);color:#fff}
  .ctl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer}
  .ctl:hover{border-color:var(--accent)}

  /* mobile section bar (hidden on desktop) */
  .secbar{display:none}

  .doc{max-width:800px;padding:32px 32px 120px}
  .doc .big-h{font-size:28px;margin:.1em 0 .1em;display:flex;align-items:center;gap:14px;font-weight:700}
  .doc .big-h .big{width:46px;height:46px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
  .badge2{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-weak);border:1px solid var(--accent);border-radius:999px;padding:3px 9px}
  .lead{color:var(--muted);font-size:16px;margin:.5em 0 1.4em}
  .doc h3{font-size:18px;margin:1.9em 0 .5em;display:flex;align-items:center;gap:10px}
  .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
  .codewrap{position:relative;margin:12px 0}
  pre{background:var(--code-bg);color:#e6edf3;border-radius:11px;padding:16px 18px;overflow:auto;margin:0;font-size:13.5px;line-height:1.55}
  .copy{position:absolute;top:8px;right:8px;border:1px solid #ffffff22;background:#ffffff14;color:#cfd6e4;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
  .copy:hover{background:#ffffff26}
  .note{border:1px solid var(--border);background:var(--chip);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;margin:14px 0;font-size:14px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0}
  .card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--side)}
  .card .i{width:32px;height:32px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-size:17px;margin-bottom:9px}
  .card h4{margin:.1em 0 .3em;font-size:15px}
  .card p{margin:0;color:var(--muted);font-size:13.5px}
  .deflist{margin:12px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .deflist .row{display:flex;gap:14px;padding:12px 16px;border-top:1px solid var(--border)}
  .deflist .row:first-child{border-top:0}
  .deflist code{color:var(--accent);font-size:13.5px;white-space:nowrap}
  .deflist span{color:var(--muted);font-size:14px}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .links button{border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:14px;background:var(--bg);color:var(--fg);cursor:pointer}
  .links button:hover{border-color:var(--accent);color:var(--accent)}
  .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
  .btn{padding:11px 18px;border-radius:10px;font-size:15px;font-weight:600;border:1px solid var(--border);background:var(--bg);color:var(--fg);cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  @media(max-width:980px){
    .app{grid-template-columns:96px 1fr}
    .side{display:none}
    .topbar{position:static}
    .secbar{display:flex;gap:8px;overflow-x:auto;padding:12px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:4;-webkit-overflow-scrolling:touch}
    .secbar button{flex:none;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
    .secbar button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
    .cards{grid-template-columns:1fr 1fr}
    .doc{padding:26px 24px 90px}
  }
  @media(max-width:640px){
    .app{grid-template-columns:1fr;height:auto;min-height:100vh}
    .rail{flex-direction:row;align-items:center;height:auto;padding:10px 12px;gap:8px;position:sticky;top:0;z-index:6}
    .rail .fw{flex-direction:row;width:auto;gap:8px;padding:8px 13px;border-radius:999px;font-size:13px}
    .rail .fw .ic{width:22px;height:22px;border-radius:7px}
    .rail .sep{display:none}.rail .grow{display:none}.rail .ava{display:none}
    .secbar{top:0}
    .topbar{padding:12px 16px}
    .doc{padding:22px 16px 80px}
    .doc .big-h{font-size:23px}.doc .big-h .big{width:38px;height:38px}
    .cards{grid-template-columns:1fr}
    pre{font-size:12.5px}
  }
</style>
</head>

<div class="app">
  <nav class="rail" id="rail"></nav>

  <aside class="side">
    <h2><span class="ic" id="side-ico"></span><span id="side-name"></span></h2>
    <p class="sub" id="side-sub"></p>
    <div id="side-secs"></div>

      <button class="ctl" id="theme">🌙 <span id="theme-label">Koyu</span></button>
    </div>
    <div class="secbar" id="secbar"></div>
    <div class="doc" id="content"></div>
  </div>
</div>

`import { useDataTable, DataTable } from '@acunsoft/datatable-react';
import { createColumns } from '@acunsoft/datatable-core';

const columns = createColumns<Order>([
  { id: 'customer', header: 'Müşteri', accessorKey: 'customer', enableSorting: true },
  { id: 'total', header: 'Tutar', accessorKey: 'total', enableSorting: true },
]);

export function Orders({ rows }: { rows: Order[] }) {
  const table = useDataTable({ rows, columns, getRowId: r => r.id,
    initialState: { page: 1, pageSize: 25 } });
  return <DataTable table={table} />;
}` },

function go(id, sec){
  const it=NAV.find(n=>n.id===id)||HOME;
  const section = sec && it.sections.includes(sec) ? sec
    : (it.sections.includes(curSec) ? curSec : it.sections[0]);
  curItem=it.id; curSec=section; persist(); renderAll();
}
function persist(){try{localStorage.setItem('adt-lang',lang);localStorage.setItem('adt-item',curItem);localStorage.setItem('adt-sec',curSec);}catch(e){}}

/* ---------- block builders ---------- */
function blocksFor(it, sec){
  const t=T[lang];
  if(it.type==="home"){
    if(sec==="overview") return [{hero:{t:t.hero_t,s:t.hero_s,ctas:[["vue","install",t.hero_c1,true],["home","features",t.hero_c2,false]]}}];
    if(sec==="quickstart") return [{p:t.qs_intro},{step:1,label:t.install},{code:"npm install @acunsoft/datatable-core",lang:"bash"},{p:t.qs_pick},{links:FW.map(f=>[f.id,"install",f.name])}];
    if(sec==="features") return [{cards:FEATURES[lang]}];
  }
  if(sec==="install") return [{lead:it.lead[lang]},{step:1,label:t.install},{code:it.install,lang:"bash"},{note:it.note[lang]},{step:2,label:t.usage},{code:it.code,lang:it.lang}];
  if(sec==="features") return [{p:t.feat_intro(it.name)},{cards:FEATURES[lang]}];
  if(sec==="examples") return [{h:t.ex_basic},{code:it.code,lang:it.lang},{h:t.ex_core},{code:CORE_EXAMPLE,lang:"typescript"}];
  if(sec==="api") return [{p:t.api_intro},{deflist:API[lang]}];
  return [];
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function blockHTML(b){
  const t=T[lang];
  if(b.hero) return `<div class="big-h" style="font-size:34px">${esc(b.hero.t)}</div><p class="lead">${esc(b.hero.s)}</p><div class="btns">${b.hero.ctas.map(c=>`<button class="btn ${c[3]?'primary':''}" data-go="${c[0]}:${c[1]}">${esc(c[2])}</button>`).join('')}</div>`;
  if(b.lead) return `<p class="lead">${b.lead}</p>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.h) return `<h3>${esc(b.h)}</h3>`;
  if(b.step) return `<h3><span class="num">${b.step}</span>${esc(b.label)}</h3>`;
  if(b.code) return `<div class="codewrap"><pre><code class="language-${b.lang}">${esc(b.code)}</code></pre><button class="copy">${t.copy}</button></div>`;
  if(b.note) return `<div class="note">${b.note}</div>`;
  if(b.cards) return `<div class="cards">${b.cards.map(c=>`<div class="card"><div class="i">${c[0]}</div><h4>${esc(c[1])}</h4><p>${esc(c[2])}</p></div>`).join('')}</div>`;
  if(b.deflist) return `<div class="deflist">${b.deflist.map(r=>`<div class="row"><code>${esc(r[0])}</code><span>${esc(r[1])}</span></div>`).join('')}</div>`;
  if(b.links) return `<div class="links">${b.links.map(l=>`<button data-go="${l[0]}:${l[1]}">${esc(l[2])} →</button>`).join('')}</div>`;
  return '';
}

/* ---------- renderers ---------- */
function renderRail(){
  const el=$('#rail'); el.innerHTML='';
  NAV.forEach((n,i)=>{
    if(i===1){ const s=document.createElement('div'); s.className='sep'; el.appendChild(s); }
    const b=document.createElement('button');
    b.className='fw'+(n.id===curItem?' active':''); b.title=nameOf(n);
    b.innerHTML=`<span class="ic">${n.ico}</span>${nameOf(n)}`;
    b.onclick=()=>go(n.id);
    el.appendChild(b);
  });
  const g=document.createElement('div'); g.className='grow'; el.appendChild(g);
  const a=document.createElement('div'); a.className='ava'; el.appendChild(a);
}
function renderSidebar(){
  const it=item(), t=T[lang];
  $('#side-ico').innerHTML=it.ico; $('#side-name').textContent=nameOf(it);
  $('#side-sub').textContent = it.type==="home" ? t.getStart : (it.preview?t.preview:t.core);
  const wrap=$('#side-secs'), bar=$('#secbar'); wrap.innerHTML=''; bar.innerHTML='';
  it.sections.forEach(sec=>{
    const b=document.createElement('button');
    b.className='sec'+(sec===curSec?' active':'');
    b.innerHTML=`<span class="dot"></span>${t[sec]}`;
    b.onclick=()=>go(it.id,sec);
    wrap.appendChild(b);
    const m=document.createElement('button');
    m.className=(sec===curSec?'active':''); m.textContent=t[sec];
    m.onclick=()=>{go(it.id,sec);};
    bar.appendChild(m);
  });
}
function renderContent(){
  const it=item(), t=T[lang];
  const badge = it.type==="home" ? "" : `<span class="badge2">${it.preview?t.preview:t.core}</span>`;
  const head = it.type==="home" ? "" :
    `<div class="big-h"><span class="big">${it.ico}</span>${it.name} ${badge}</div>`;
  const body = blocksFor(it,curSec).map(blockHTML).join('');
  $('#content').innerHTML = head + body;
  $('#crumb').textContent = `${t.getStart} · ${nameOf(it)} · ${t[curSec]}`;
  document.querySelectorAll('#content pre code').forEach(b=>{try{hljs.highlightElement(b);}catch(e){}});
}
function renderAll(){ renderRail(); renderSidebar(); renderContent(); applyThemeLabel(); updateLang(); }

/* ---------- controls ---------- */
function updateLang(){ document.documentElement.lang=lang; document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); }
document.querySelectorAll('#lang button').forEach(btn=>{ btn.onclick=()=>{lang=btn.dataset.lang;persist();renderAll();}; });

let theme='light';
try{theme=localStorage.getItem('adt-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}catch(e){}
function applyThemeLabel(){ document.documentElement.setAttribute('data-theme',theme);
  const th=$('#theme'); th.firstChild.textContent=theme==='dark'?'☀ ':'🌙 ';
  $('#theme-label').textContent=lang==='tr'?(theme==='dark'?'Açık':'Koyu'):(theme==='dark'?'Light':'Dark'); }
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('adt-theme',theme);}catch(e){}applyThemeLabel();};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ const [i,s]=g.dataset.go.split(':'); go(i,s); return; }
  const c=e.target.closest('.copy'); if(c){ const code=c.closest('.codewrap').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(()=>{c.textContent=T[lang].copied;setTimeout(()=>c.textContent=T[lang].copy,1200);}).catch(()=>{}); }
});

document.documentElement.setAttribute('data-theme',theme);
renderAll();
</script>
</body>
</html>
